# PET-sensitivity re-extraction at 1 km, 1991-2020 only, on CI.
#
# The Gate 2 SMD finding carries one caveat: Hargreaves-Samani PET runs
# ~a third high in a maritime climate, and a uniform bias does NOT
# cancel out of max(PET - rain, 0). This run answers whether that bias
# moves the MAP (which the pricing experiment uses) or only the LEVEL
# (which calibration re-pins anyway), at the same 1 km resolution the
# priced climatology (data/smd_climatology.csv) was built from. The
# streamer's --pet-sensitivity flag adds the drought integrals at
# PET x 0.85 and x 0.70 as *_k85/*_k70 columns; the verdict comes from
# scripts/check_pet_sensitivity.py on the merged table. The same flag
# is running on the local 5 km archive as the cross-check.
#
# Only 1991-2020 (plus one spin-up year per slice) because that is the
# climatology window the experiment prices - 81 GB instead of 174.
# Four slices, per the probe's finding that CEDA throttles the ACCOUNT
# at ~14.5 MB/s aggregate (haduk-1km.yml has the numbers).
#
# WHY THIS EXISTS AS ITS OWN WORKFLOW rather than an input on
# haduk-1km.yml: the slice boundaries, the coverage assertion and the
# year window all differ, and a dispatch input that reshapes a matrix
# is exactly the kind of undocumented knob this repo does not do.
#
# Nothing here is wired into the model. The merged CSV is measurement.
name: haduk 1km PET sensitivity

# Push trigger retired 2026-08-31: run 33404395072 answered the
# question (Spearman vs k=1.00 >= +0.9983 cwd_yr / +0.9940 smd_jja at
# 1 km - the bias moves the level, not the map, agreeing with the 5 km
# instrument). Re-running would spend CEDA quota the sectors run needs.
on:
  workflow_dispatch:

# fetch_haduk.py reads CEDA_TOKEN before ~/.ceda_token, so the secret
# needs no file and is never written to disk. Only its expiry is printed.
env:
  CEDA_TOKEN: ${{ secrets.CEDA_TOKEN }}

concurrency:
  group: haduk-1km-pet
  cancel-in-progress: false

jobs:
  extract:
    name: ${{ matrix.slice.from }}-${{ matrix.slice.to }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # Every slice fetches one spin-up year it does not emit, so the
        # SMD bucket (capped at 150 mm, rewets over a winter) is warm at
        # its first emitted 1 January. cwd_yr resets each 1 January by
        # definition and is exact in every slice; cwd_run is slice-
        # restarted here and NOT the object of this run.
        slice:
          - { from: 1990, to: 1997, emit: 1991 }
          - { from: 1997, to: 2004, emit: 1998 }
          - { from: 2004, to: 2012, emit: 2005 }
          - { from: 2012, to: 2020, emit: 2013 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt xarray netCDF4

      - name: Extract ${{ matrix.slice.from }}-${{ matrix.slice.to }}
        run: |
          test -n "$CEDA_TOKEN" || {
            echo "::error::CEDA_TOKEN secret is not set on this repo."
            exit 1
          }
          ok=0
          for attempt in 1 2 3; do
            if python -u scripts/haduk_1km_stream.py \
                --from ${{ matrix.slice.from }} --to ${{ matrix.slice.to }} \
                --pet-sensitivity --hours 4.8; then
              ok=1; break
            fi
            echo "attempt $attempt failed; resuming from the checkpoint"
            sleep 90
          done
          test "$ok" = 1

      - name: Drop the spin-up year
        run: |
          python - <<'PY'
          import csv
          path = "data/haduk_district_annual_1km.csv"
          with open(path, newline="") as f:
              rows = [r for r in csv.DictReader(f)
                      if int(r["year"]) >= ${{ matrix.slice.emit }}]
          years = sorted({r["year"] for r in rows})
          print(f"emitting {len(rows)} rows, years {years[0]}-{years[-1]}"
                if rows else "NOTHING TO EMIT")
          with open(path, "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0]))
              w.writeheader()
              w.writerows(rows)
          PY

      - name: Upload slice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haduk-1km-pet-${{ matrix.slice.from }}-${{ matrix.slice.to }}
          path: |
            data/haduk_district_annual_1km.csv
            data/haduk_1km_state.npz
          if-no-files-found: warn

  merge:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: haduk-1km-pet-*
          path: slices

      - name: Merge and verify coverage
        run: |
          python - <<'PY'
          import csv, glob, sys
          rows = []
          for p in sorted(glob.glob("slices/*/haduk_district_annual_1km.csv")):
              with open(p, newline="") as f:
                  got = list(csv.DictReader(f))
              print(f"{p}: {len(got)} rows")
              rows += got
          keys = [(r["district"], r["year"]) for r in rows]
          assert len(keys) == len(set(keys)), "duplicate district-years"
          for c in ("cwd_yr_max_mm_k85", "cwd_yr_max_mm_k70",
                    "smd_jja_mean_mm_k85", "smd_jja_mean_mm_k70"):
              assert c in rows[0], f"missing sensitivity column {c}"
          rows.sort(key=lambda r: (r["district"], int(r["year"])))
          with open("haduk_1km_pet_sensitivity.csv", "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0]))
              w.writeheader()
              w.writerows(rows)
          years = {int(r["year"]) for r in rows}
          missing = sorted(set(range(1991, 2021)) - years)
          n_d = len({r["district"] for r in rows})
          print(f"{len(rows)} rows, {n_d} districts, "
                f"{len(years)} years, missing: {missing or 'none'}")
          if missing or len(rows) != n_d * 30:
              sys.exit("INCOMPLETE - see the slice artifacts")
          PY

      - name: Install scipy for the verdict
        run: pip install numpy scipy

      - name: The verdict itself
        run: |
          python -u scripts/check_pet_sensitivity.py \
            haduk_1km_pet_sensitivity.csv

      - name: Upload merged table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haduk-1km-pet-sensitivity
          path: haduk_1km_pet_sensitivity.csv
          if-no-files-found: error
