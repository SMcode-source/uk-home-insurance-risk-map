name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  copula-properties:
    name: copula property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run property tests
        # Verifies the maths the model rests on: uniform margins, Gumbel
        # h-function inversion, recovered Kendall's tau, upper-tail
        # dependence, and that severities match the published ABI means.
        run: python -m pytest tests -q

      - name: Check the published site rebuilds from committed data
        # The model outputs (districts_risk.geojson, year_analysis.json) are
        # committed, so the whole publish chain must run without refetching
        # any hazard data.
        run: |
          python scripts/build_map.py
          python scripts/build_analysis.py
          python scripts/build_site.py
          for f in docs/index.html docs/map.html docs/years.html \
                   docs/methodology.html docs/assets/districts.json \
                   docs/assets/uk_district_risk.csv; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          if grep -REl "__[A-Z][A-Z_]*__" docs/*.html; then
            echo "unfilled template placeholder above"; exit 1
          fi

      - name: Check the published site is up to date with committed data
        # A drifted docs/ means someone edited a template without rebuilding.
        run: |
          if ! git diff --quiet -- docs/; then
            echo "docs/ is stale - run scripts/build_site.py and commit:"
            git diff --stat -- docs/
            exit 1
          fi

  layout:
    # The published pages in a real browser. Exists because one mobile
    # audit found three user-facing defects (3.6px chart labels, zoom
    # buttons buried under a panel, a popup clipped off screen) that all
    # 38 data-side tests were structurally blind to. Runs against the
    # COMMITTED docs/ - the job above already proves docs/ is fresh.
    name: layout regression (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run layout tests
        run: python -m pytest tests/test_layout.py -q
