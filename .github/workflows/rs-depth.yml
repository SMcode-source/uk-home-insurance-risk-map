name: river/sea depth

# Refetches river/sea depth for either grain (built 2026-09-26). Samples the EA RoFRS depth
# layers (rofrs_4band_<d>_depth, d = 0.2 ... 1.2 m) and the band itself
# at every English unit-postcode centroid - scripts/
# fetch_rs_depth_postcodes.py --flags - in four parallel parts per
# edition, then aggregates them to this ref's grain as data/rs_depth.csv
# and data/rs_depth_cc.csv.
#
# The band files (data/cache/rs_depth_bands_p<i>[_cc].csv) are the
# whole input to the aggregation: the envelope is read in the same pass
# (b00), so nothing depends on a gitignored intermediate of another
# fetch, and the SAME files aggregate at either grain. They are uploaded
# as an artifact for exactly that reason - the other grain aggregates
# them without refetching.
#
# About 0.3 min per 26.6 km tile on a laptop, ~400 tiles per edition,
# so each part is well inside the job limit.

on:
  # Dispatch only. While it was an experiment it also ran on pushes to
  # exp/rs-depth[-sector] (a dispatch needs the file on main); those
  # runs - 36205880535 and the independent 36207569273 - produced the
  # published tables and reproduced them.
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit rs_depth[_cc].csv back to this branch"
        type: boolean
        default: false

concurrency:
  group: rs-depth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bands:
    name: bands ${{ matrix.edition }} part ${{ matrix.part }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: true
      matrix:
        edition: [present, climate]
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # fetch_onspd.py refuses to reproject without the grid rather than
      # fall back to a Helmert shift ~1.75 m from the model's transform.
      - name: Install the OSTN15 datum grid
        run: |
          dir=$(python -c "from pyproj import datadir; print(datadir.get_user_data_dir())")
          mkdir -p "$dir"
          curl -fsSL -o "$dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif
          echo "5d6ed64d2119952c4c559fa1fccbc594b6520fc3ec3ef2fc10be13202c4384fa  $dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" | sha256sum -c
      - run: python -u scripts/fetch_onspd.py
      - name: Sample the band and depth layers
        run: |
          python -u scripts/fetch_rs_depth_postcodes.py --flags --part ${{ matrix.part }}/4 \
            ${{ matrix.edition == 'climate' && '--climate' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: rs-bands-${{ matrix.edition }}-${{ matrix.part }}
          path: data/cache/rs_depth_bands_p*
          retention-days: 30

  aggregate:
    name: aggregate and check
    needs: bands
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boundaries for whichever grain this ref builds
        run: |
          if [ -f data/sectors_gb.gpkg ]; then
            echo "sector grain: the geometry is committed on this branch"
          else
            git clone --depth 1 https://github.com/missinglink/uk-postcode-polygons.git data/uk-postcode-polygons
          fi
      - name: Install the OSTN15 datum grid
        run: |
          dir=$(python -c "from pyproj import datadir; print(datadir.get_user_data_dir())")
          mkdir -p "$dir"
          curl -fsSL -o "$dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif
          echo "5d6ed64d2119952c4c559fa1fccbc594b6520fc3ec3ef2fc10be13202c4384fa  $dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" | sha256sum -c
      - run: python -u scripts/fetch_onspd.py
      - uses: actions/download-artifact@v4
        with:
          pattern: rs-bands-*
          path: data/cache
          merge-multiple: true
      # A dropped tile writes .partial: it would read as "no depth here".
      - name: Reject an incomplete fetch
        run: |
          ls -l data/cache/rs_depth_bands_p*
          if ls data/cache/*.partial 2>/dev/null; then
            echo "::error::a band fetch fell short (.partial) - refusing to aggregate"
            exit 1
          fi
      - run: python -u scripts/fetch_rs_depth_postcodes.py
      - run: python -u scripts/fetch_rs_depth_postcodes.py --climate
      - uses: actions/upload-artifact@v4
        with:
          name: rs-depth-tables
          path: |
            data/rs_depth.csv
            data/rs_depth_cc.csv
          retention-days: 30
      - name: Commit the tables to this branch
        if: ${{ inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rs_depth.csv data/rs_depth_cc.csv
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "River/sea depth bands by postcode share (run ${{ github.run_number }})"
            git push origin HEAD
          fi
