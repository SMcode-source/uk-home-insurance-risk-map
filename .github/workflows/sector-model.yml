name: sector model

# The whole sector-level pipeline, off the laptop: fetch the four
# geometry-keyed hazard datasets over the 10,398 derived sector polygons
# (in parallel - they are independent services), then build the model
# and COMMIT the results to this branch, so nothing depends on a machine
# that sleeps or on 14-day artifact expiry.
#
# This branch is an experiment pipeline: the full test preflight is NOT
# run here (several tests read the committed district outputs, which
# this branch deliberately deletes). The model's own identity suite
# runs against the freshly built sector output instead.
#
# Known risk, accepted: EA/NRW/SEPA have never been fetched from GitHub
# runner IPs before (BGS famously blocks them; that is why the geology
# comes from this repo's mirror). If a service throttles runners the
# fetch job fails loudly and the fallback is a slow local resume.

on:
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Reuse committed sector hazard CSVs; just rebuild"
        type: boolean
        default: false
      climate:
        description: "Fetch the EA climate-change editions (SW + depth) instead"
        type: boolean
        default: false

concurrency:
  group: sector-model
  cancel-in-progress: false

jobs:
  erosion:
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_erosion.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-erosion, path: data/erosion.csv, retention-days: 14 }

  ct-bands:
    # Council-tax band mix, the value proxy behind the attritional
    # severities (DATA_SOURCES.md #30). Cheap next to the hazard
    # fetches - two zips and a postcode apportionment, no WMS - but it
    # MUST run here rather than reuse main's file: main's ct_bands.csv
    # is keyed on districts ("AB10") and every sector row ("AB10 1")
    # would miss. ct_value_from_bands turns a >20% miss rate into a
    # SystemExit, so the build fails loudly rather than silently
    # neutralising the relativity - but it does fail, hence this job.
    #
    # Runs regardless of skip_fetch, unlike the hazard fetches. It is
    # not a hazard fetch: two zips and a postcode apportionment, ~10
    # minutes and no WMS to 403 us. Gating it on skip_fetch would mean
    # a model-only rebuild had to refetch flood as well (240-minute
    # timeout) purely to get this file, which is the opposite of what
    # skip_fetch is for.
    if: ${{ !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_ct_bands.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-ct-bands, path: data/ct_bands.csv, retention-days: 14 }

  flood:
    # present-day only. The EA 403s runner IPs for the rivers/sea WMS
    # after ~3.5 h (it did, over the sectors), so the climate edition of
    # this one is fetched from a laptop and committed.
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_flood.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-flood, path: data/flood_fractions.csv, retention-days: 14 }

  surface-water:
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_surface_water.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-sw, path: data/sw_fractions.csv, retention-days: 14 }

  depth:
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_sw_depth.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-depth, path: data/sw_depth.csv, retention-days: 14 }

  surface-water-climate:
    name: surface water (climate)
    if: ${{ inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_surface_water.py --climate
      - uses: actions/upload-artifact@v4
        with: { name: sector-sw-cc, path: data/sw_fractions_cc.csv, retention-days: 14 }

  depth-climate:
    name: depth bands (climate)
    if: ${{ inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_sw_depth.py --climate
      - uses: actions/upload-artifact@v4
        with: { name: sector-depth-cc, path: data/sw_depth_cc.csv, retention-days: 14 }

  model:
    # needs: every fetch job, but tolerate the paths where some are
    # skipped (skip_fetch, or the climate-only pass)
    needs: [erosion, ct-bands, flood, surface-water, depth,
            surface-water-climate, depth-climate]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Overlay fetched hazard data
        if: ${{ !inputs.skip_fetch }}
        uses: actions/download-artifact@v4
        with:
          path: data
          merge-multiple: true

      # Separate from the overlay above because the ct-bands job runs
      # even under skip_fetch, and that overlay does not. Named rather
      # than merge-multiple so a skip_fetch run pulls this one file and
      # leaves the committed hazard CSVs alone.
      - name: Overlay the council-tax band mix
        if: ${{ !inputs.climate }}
        uses: actions/download-artifact@v4
        with:
          name: sector-ct-bands
          path: data

      # Geology from the repo's own mirror - BGS blocks runner IPs
      # (same block and hashes as rebuild.yml; see DATA_SOURCES.md #2).
      - name: Download BGS geology from the data mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-bgs-625k-v1 --dir data             --pattern 'bgs_625k_*.geojson.gz'
          gunzip data/bgs_625k_bedrock.geojson.gz                  data/bgs_625k_superficial.geojson.gz
          sha256sum -c <<'SUMS'
          66524b94dfeb491a746994dfa5e334b52a9b15a42f82c15977df1d5c100c3fb7  data/bgs_625k_bedrock.geojson
          a029e2ab61190c7103983c33d77c24743c7bb2c9fcfcd25ebd063ab9f3c38aee  data/bgs_625k_superficial.geojson
          SUMS
          python -u scripts/fetch_bgs.py --verify

      - name: Build the sector model
        env:
          UKRISK_THREADS: "0"
        run: python -u scripts/build_model.py

      # Artifact BEFORE the identity gate: a failed assertion should
      # leave the 14-minute build inspectable, not vaporise it with the
      # runner (run 31536995030 did exactly that).
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sector-model-output-raw
          path: |
            data/districts_risk.geojson
            data/year_analysis.json
          retention-days: 14

      - name: Check the output against the model's own identities
        run: python -m pytest tests -q -k identities

      - name: Commit sector outputs to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/erosion.csv data/flood_fractions.csv \
                  data/sw_fractions.csv data/sw_depth.csv \
                  data/ct_bands.csv \
                  data/districts_risk.geojson data/year_analysis.json
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Sector model: cloud fetch + build (run ${{ github.run_number }})"
            git push origin HEAD
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sector-model-output
          path: |
            data/districts_risk.geojson
            data/year_analysis.json
          retention-days: 14
