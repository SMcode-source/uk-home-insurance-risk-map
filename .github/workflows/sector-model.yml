name: sector model

# The whole sector-level pipeline, off the laptop: fetch the four
# geometry-keyed hazard datasets over the 10,398 derived sector polygons
# (in parallel - they are independent services), then build the model
# and COMMIT the results to this branch, so nothing depends on a machine
# that sleeps or on 14-day artifact expiry.
#
# This branch is an experiment pipeline: the full test preflight is NOT
# run here (several tests read the committed district outputs, which
# this branch deliberately deletes). The model's own identity suite
# runs against the freshly built sector output instead.
#
# Known risk, accepted: EA/NRW/SEPA have never been fetched from GitHub
# runner IPs before (BGS famously blocks them; that is why the geology
# comes from this repo's mirror). If a service throttles runners the
# fetch job fails loudly and the fallback is a slow local resume.

on:
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Reuse committed sector hazard CSVs; just rebuild"
        type: boolean
        default: false
      climate:
        description: "Fetch the EA climate-change editions (SW + depth) instead"
        type: boolean
        default: false

concurrency:
  group: sector-model
  cancel-in-progress: false

jobs:
  erosion:
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_erosion.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-erosion, path: data/erosion.csv, retention-days: 14 }

  flood:
    # present-day only, by POSTCODE share: one ~6-minute pass over the
    # WMS masks at every ONSPD unit-postcode centroid (the area-share
    # fetch_flood.py took ~5 h over the sectors, and the EA 403s runner
    # IPs after ~3.5 h). The climate edition
    # (fetch_flood_postcodes.py --climate) is fetched from a laptop and
    # committed, as before.
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # fetch_onspd.py reprojects ONSPD lat/long to British National Grid
      # and refuses to run without the OSTN15 grid (a Helmert fallback
      # would put every centroid ~1.75 m off the model's own transform).
      # Same step and hash as the model job below. Found by the first
      # full fetch after the postcode-share publish (run 34056186038):
      # both jobs died here in 5 seconds, before touching any service.
      - name: Install the OSTN15 datum grid
        run: |
          dir=$(python -c "from pyproj import datadir; print(datadir.get_user_data_dir())")
          mkdir -p "$dir"
          curl -fsSL -o "$dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" \
            https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif
          echo "5d6ed64d2119952c4c559fa1fccbc594b6520fc3ec3ef2fc10be13202c4384fa  $dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" \
            | sha256sum -c
      - run: python -u scripts/fetch_onspd.py
      - run: python -u scripts/fetch_flood_postcodes.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-flood, path: data/flood_fractions.csv, retention-days: 14 }

  surface-water:
    # by POSTCODE share since 2026-09-06 (fetch_sw_postcodes.py): the
    # same masks fetch_surface_water.py rasterises, sampled at every
    # ONSPD unit-postcode centroid (~10-15 minutes per region, no
    # pixel-to-polygon work; the area fetch took up to 300 minutes),
    # then aggregated to this checkout's grain. A dropped tile writes a
    # .partial file and the aggregation refuses it. The depth conditional
    # keeps the committed AREA-share envelope (sw_fractions_area.csv);
    # refresh that with fetch_surface_water.py from a laptop if the
    # extents change.
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # fetch_onspd.py reprojects ONSPD lat/long to British National Grid
      # and refuses to run without the OSTN15 grid (a Helmert fallback
      # would put every centroid ~1.75 m off the model's own transform).
      # Same step and hash as the model job below. Found by the first
      # full fetch after the postcode-share publish (run 34056186038):
      # both jobs died here in 5 seconds, before touching any service.
      - name: Install the OSTN15 datum grid
        run: |
          dir=$(python -c "from pyproj import datadir; print(datadir.get_user_data_dir())")
          mkdir -p "$dir"
          curl -fsSL -o "$dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" \
            https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif
          echo "5d6ed64d2119952c4c559fa1fccbc594b6520fc3ec3ef2fc10be13202c4384fa  $dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" \
            | sha256sum -c
      - run: python -u scripts/fetch_onspd.py
      - run: python -u scripts/fetch_sw_postcodes.py --flags england
      - run: python -u scripts/fetch_sw_postcodes.py --flags wales
      - run: python -u scripts/fetch_sw_postcodes.py --flags scotland
      - run: python -u scripts/fetch_sw_postcodes.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-sw, path: data/sw_fractions.csv, retention-days: 14 }

  depth:
    if: ${{ !inputs.skip_fetch && !inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_sw_depth.py
      - uses: actions/upload-artifact@v4
        with: { name: sector-depth, path: data/sw_depth.csv, retention-days: 14 }

  surface-water-climate:
    name: surface water (climate)
    if: ${{ inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # England only (the EA rofsw_cc01 edition), by postcode share so the
      # future shares the present-day denominator; the area-share
      # climate envelope for the depth conditional stays committed as
      # sw_fractions_area_cc.csv.
      # fetch_onspd.py reprojects ONSPD lat/long to British National Grid
      # and refuses to run without the OSTN15 grid (a Helmert fallback
      # would put every centroid ~1.75 m off the model's own transform).
      # Same step and hash as the model job below. Found by the first
      # full fetch after the postcode-share publish (run 34056186038):
      # both jobs died here in 5 seconds, before touching any service.
      - name: Install the OSTN15 datum grid
        run: |
          dir=$(python -c "from pyproj import datadir; print(datadir.get_user_data_dir())")
          mkdir -p "$dir"
          curl -fsSL -o "$dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" \
            https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif
          echo "5d6ed64d2119952c4c559fa1fccbc594b6520fc3ec3ef2fc10be13202c4384fa  $dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif" \
            | sha256sum -c
      - run: python -u scripts/fetch_onspd.py
      - run: python -u scripts/fetch_sw_postcodes.py --flags england --climate
      - run: python -u scripts/fetch_sw_postcodes.py --climate
      - uses: actions/upload-artifact@v4
        with: { name: sector-sw-cc, path: data/sw_fractions_cc.csv, retention-days: 14 }

  depth-climate:
    name: depth bands (climate)
    if: ${{ inputs.climate }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -u scripts/fetch_sw_depth.py --climate
      - uses: actions/upload-artifact@v4
        with: { name: sector-depth-cc, path: data/sw_depth_cc.csv, retention-days: 14 }

  model:
    # needs: every fetch job, but tolerate the paths where some are
    # skipped (skip_fetch, or the climate-only pass)
    needs: [erosion, flood, surface-water, depth,
            surface-water-climate, depth-climate]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Overlay fetched hazard data
        if: ${{ !inputs.skip_fetch }}
        uses: actions/download-artifact@v4
        with:
          path: data
          merge-multiple: true

      # Geology from the repo's own mirror - BGS blocks runner IPs
      # (same block and hashes as rebuild.yml; see DATA_SOURCES.md #2).
      - name: Download BGS geology from the data mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-bgs-625k-v1 --dir data             --pattern 'bgs_625k_*.geojson.gz'
          gunzip data/bgs_625k_bedrock.geojson.gz                  data/bgs_625k_superficial.geojson.gz
          sha256sum -c <<'SUMS'
          66524b94dfeb491a746994dfa5e334b52a9b15a42f82c15977df1d5c100c3fb7  data/bgs_625k_bedrock.geojson
          a029e2ab61190c7103983c33d77c24743c7bb2c9fcfcd25ebd063ab9f3c38aee  data/bgs_625k_superficial.geojson
          SUMS
          python -u scripts/fetch_bgs.py --verify

      # Same datum grid as rebuild.yml, so both grains transform WGS84
      # to British National Grid the same way (the published model uses
      # OSTN15 since 2026-09-05; a runner without it falls back to the
      # Helmert approximation and the sector grain would silently differ
      # from the district grain). sha256 pinned; cdn.proj.org.
      - name: Install the OSTN15 datum grid
        run: |
          dir=$(python -c "from pyproj import datadir; print(datadir.get_user_data_dir())")
          mkdir -p "$dir"
          curl -fsSL -o "$dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif"             https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif
          echo "5d6ed64d2119952c4c559fa1fccbc594b6520fc3ec3ef2fc10be13202c4384fa  $dir/uk_os_OSTN15_NTv2_OSGBtoETRS.tif"             | sha256sum -c
          python -c "from pyproj.transformer import TransformerGroup as G; print('proj pipeline', G(4326, 27700, always_xy=True).transformers[0].description)"

      # The subsidence geology is read at the unit postcodes since
      # 2026-09-06 (score_subsidence_postcodes.py, ~3 minutes): the
      # table is a committed model input like the flood fractions and
      # is regenerated here whenever the hazard data is refetched.
      # After the OSTN15 step: it transforms the BGS layers to British
      # National Grid and must use the model's own transform.
      - name: Subsidence geology at the unit postcodes
        if: ${{ !inputs.skip_fetch && !inputs.climate }}
        run: |
          python -u scripts/fetch_onspd.py
          python -u scripts/score_subsidence_postcodes.py

      - name: Build the sector model
        env:
          UKRISK_THREADS: "0"
        run: python -u scripts/build_model.py

      # Artifact BEFORE the identity gate: a failed assertion should
      # leave the 14-minute build inspectable, not vaporise it with the
      # runner (run 31536995030 did exactly that).
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sector-model-output-raw
          path: |
            data/districts_risk.geojson
            data/year_analysis.json
          retention-days: 14

      - name: Check the output against the model's own identities
        run: python -m pytest tests -q -k identities

      - name: Commit sector outputs to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/erosion.csv data/flood_fractions.csv \
                  data/sw_fractions.csv data/sw_depth.csv \
                  data/subsidence_postcodes.csv \
                  data/districts_risk.geojson data/year_analysis.json
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Sector model: cloud fetch + build (run ${{ github.run_number }})"
            git push origin HEAD
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sector-model-output
          path: |
            data/districts_risk.geojson
            data/year_analysis.json
          retention-days: 14
